# Local/demo stack. `cp .env.example .env`, fill secrets, then: docker compose up --build
# (Authored without a Docker daemon in the sandbox — the app itself was verified natively; see docs/TESTING.md.)
name: techmunda-jewellery-studio

x-app-env: &app-env
  DATABASE_URL: postgresql://techmunda:${POSTGRES_PASSWORD:-techmunda_dev}@postgres:5432/jewellery_studio?schema=public
  REDIS_URL: redis://redis:6379
  API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:4000}
  WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-http://localhost:3000}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY}
  URL_SIGNING_SECRET: ${URL_SIGNING_SECRET:?set URL_SIGNING_SECRET}
  AUTOMATION_WEBHOOK_SECRET: ${AUTOMATION_WEBHOOK_SECRET:?set AUTOMATION_WEBHOOK_SECRET}
  STORAGE_DRIVER: s3
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: ${S3_BUCKET:-jewellery-studio}
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  S3_FORCE_PATH_STYLE: "true"
  AI_MODE: ${AI_MODE:-auto}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_TEXT_MODEL: ${OPENAI_TEXT_MODEL:-gpt-4.1-mini}
  OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-1}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:4000/api/v1/integrations/google/callback}
  GMAIL_DESIRED_SENDER: ${GMAIL_DESIRED_SENDER:-}

services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: techmunda, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-techmunda_dev}", POSTGRES_DB: jewellery_studio }
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U techmunda -d jewellery_studio"], interval: 5s, timeout: 3s, retries: 10 }

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10 }

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}", MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}" }
    volumes: [miniodata:/data]
    ports: ["9000:9000", "9001:9001"]

  minio-init:
    image: minio/mc
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin}; do sleep 1; done; mc mb -p local/${S3_BUCKET:-jewellery-studio}; exit 0"

  migrate:
    build: { context: ., dockerfile: infrastructure/docker/Dockerfile, target: migrate }
    environment: *app-env
    depends_on: { postgres: { condition: service_healthy } }

  api:
    build: { context: ., dockerfile: infrastructure/docker/Dockerfile, target: api }
    environment: *app-env
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_healthy }, minio-init: { condition: service_completed_successfully } }
    ports: ["4000:4000"]

  worker:
    build: { context: ., dockerfile: infrastructure/docker/Dockerfile, target: worker }
    environment: *app-env
    depends_on: [api]

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: web
      args: { NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}" }
    depends_on: [api]
    ports: ["3000:3000"]

  n8n:
    image: n8nio/n8n
    profiles: ["automation"]
    environment:
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      API_BASE_URL: http://api:4000/api/v1
      TENANT_ID: ${N8N_TENANT_ID:-}
      TENANT_WEBHOOK_SECRET: ${N8N_TENANT_WEBHOOK_SECRET:-}
      INBOUND_WEBHOOK_SECRET: ${N8N_INBOUND_WEBHOOK_SECRET:-}
    ports: ["5678:5678"]
    volumes: [n8ndata:/home/node/.n8n]

volumes: { pgdata: {}, redisdata: {}, miniodata: {}, n8ndata: {} }
