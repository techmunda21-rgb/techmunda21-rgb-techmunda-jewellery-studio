name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: techmunda, POSTGRES_PASSWORD: techmunda_dev, POSTGRES_DB: jewellery_studio_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U techmunda" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      TEST_DATABASE_URL: postgresql://techmunda:techmunda_dev@localhost:5432/jewellery_studio_test?schema=public
      DATABASE_URL: postgresql://techmunda:techmunda_dev@localhost:5432/jewellery_studio_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm typecheck
      - run: pnpm test
      - run: node automation/n8n/validate.mjs
      - run: pnpm --filter @techmunda/web build
