# Render.com blueprint (UNTESTED starting point — could not be deployed from the authoring sandbox).
# Creates Postgres + Redis + API + worker + web. Fill the `sync: false` secrets in the dashboard.
# Media storage: use an S3-compatible bucket (STORAGE_DRIVER=s3) because Render disks are per-service.
databases:
  - name: techmunda-db
    plan: basic-256mb
    databaseName: jewellery_studio
services:
  - type: keyvalue
    name: techmunda-redis
    plan: starter
    ipAllowList: []
  - type: web
    name: techmunda-api
    runtime: node
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build:packages && pnpm --filter @techmunda/api build
    preDeployCommand: pnpm db:migrate
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /api/docs
    envVars:
      - { key: DATABASE_URL, fromDatabase: { name: techmunda-db, property: connectionString } }
      - { key: REDIS_URL, fromService: { type: keyvalue, name: techmunda-redis, property: connectionString } }
      - { key: API_PORT, value: "10000" }
      - { key: API_PUBLIC_URL, sync: false }
      - { key: WEB_PUBLIC_URL, sync: false }
      - { key: CORS_ORIGINS, sync: false }
      - { key: JWT_ACCESS_SECRET, generateValue: true }
      - { key: JWT_REFRESH_SECRET, generateValue: true }
      - { key: URL_SIGNING_SECRET, generateValue: true }
      - { key: AUTOMATION_WEBHOOK_SECRET, generateValue: true }
      - { key: ENCRYPTION_KEY, sync: false }
      - { key: STORAGE_DRIVER, value: s3 }
      - { key: S3_ENDPOINT, sync: false }
      - { key: S3_BUCKET, sync: false }
      - { key: S3_ACCESS_KEY, sync: false }
      - { key: S3_SECRET_KEY, sync: false }
      - { key: OPENAI_API_KEY, sync: false }
      - { key: GOOGLE_CLIENT_ID, sync: false }
      - { key: GOOGLE_CLIENT_SECRET, sync: false }
      - { key: GOOGLE_REDIRECT_URI, sync: false }
  - type: worker
    name: techmunda-worker
    runtime: node
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build:packages && pnpm --filter @techmunda/worker build
    startCommand: node apps/worker/dist/main.js
    envVars:
      - fromGroup: techmunda-shared   # create an env group mirroring the API's variables
  - type: web
    name: techmunda-web
    runtime: node
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build:packages && pnpm --filter @techmunda/web build
    startCommand: pnpm --filter @techmunda/web start
    envVars:
      - { key: NEXT_PUBLIC_API_URL, sync: false }   # e.g. https://techmunda-api.onrender.com/api/v1 (set BEFORE build)
