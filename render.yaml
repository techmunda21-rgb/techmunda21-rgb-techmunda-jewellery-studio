# One-click Render blueprint: Postgres + API + web. No Redis/worker/S3 needed for the demo:
#  - jobs run inside the API process (QUEUE_MODE=inline)
#  - files live on the API's local disk (ephemeral on free plans; demo data is re-created automatically on start)
# Secrets are generated by Render. OpenAI/Google stay empty => labelled simulations; Gmail send stays blocked until OAuth is added.
databases:
  - name: techmunda-db
    plan: free
    databaseName: jewellery_studio
    user: techmunda
services:
  - type: web
    name: techmunda-api
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm build:packages && pnpm --filter @techmunda/api build
    startCommand: pnpm db:migrate && pnpm db:seed:if-needed && node apps/api/dist/main.js
    healthCheckPath: /api/v1/public/tenants/suvarna-heritage
    envVars:
      - { key: NODE_VERSION, value: "22" }
      - { key: DATABASE_URL, fromDatabase: { name: techmunda-db, property: connectionString } }
      - { key: QUEUE_MODE, value: inline }
      - { key: STORAGE_DRIVER, value: local }
      - { key: LOCAL_STORAGE_DIR, value: /tmp/techmunda-storage }
      - { key: AI_MODE, value: auto }
      - { key: WEB_PUBLIC_URL, value: "https://techmunda-web.onrender.com" }
      - { key: CORS_ORIGINS, value: "https://techmunda-web.onrender.com" }
      - { key: JWT_ACCESS_SECRET, generateValue: true }
      - { key: JWT_REFRESH_SECRET, generateValue: true }
      - { key: URL_SIGNING_SECRET, generateValue: true }
      - { key: AUTOMATION_WEBHOOK_SECRET, generateValue: true }
      - { key: ENCRYPTION_KEY, generateValue: true }
      - { key: GMAIL_DESIRED_SENDER, value: "techmunda21@gmail.com" }
      - { key: GOOGLE_REDIRECT_URI, value: "https://techmunda-api.onrender.com/api/v1/integrations/google/callback" }
      - { key: DEMO_PASSWORD, sync: false }   # password for all demo logins — choose a private one before sharing the URL
      # Signup OTP delivery — set at least one pair, otherwise /signup says "unavailable" (it never fakes a code)
      # Pre-filled for the Gmail account techmunda21@gmail.com. ONLY the app password is a secret you must paste in Render
      # (Google account → Security → 2-Step Verification ON → App passwords → create "Techmunda" → 16 characters).
      # Render's free tier blocks outbound SMTP ports (25/465/587), so Gmail SMTP cannot work there. Use the HTTPS API below (free Brevo account).
      - { key: BREVO_API_KEY, sync: false }    # <- Brevo → SMTP & API → API keys (starts xkeysib-)
      - { key: SMTP_HOST, value: smtp.gmail.com }
      - { key: SMTP_PORT, value: "465" }
      - { key: SMTP_USER, value: techmunda21@gmail.com }
      - { key: SMTP_PASS, sync: false }        # <- paste the 16-character Google App Password here (never the account password)
      - { key: SMTP_FROM, value: "Techmunda <techmunda21@gmail.com>" }
      - { key: ALERT_EMAIL, value: techmunda21@gmail.com }   # security alerts (brute force, token replay, scanners…) are e-mailed here
      - { key: TWILIO_ACCOUNT_SID, sync: false }
      - { key: TWILIO_AUTH_TOKEN, sync: false }
      - { key: TWILIO_MESSAGING_SERVICE_SID, sync: false }
      - { key: OPENAI_API_KEY, sync: false }
      - { key: GOOGLE_CLIENT_ID, sync: false }
      - { key: GOOGLE_CLIENT_SECRET, sync: false }
  - type: web
    name: techmunda-web
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm build:packages && pnpm --filter @techmunda/web build
    startCommand: pnpm --filter @techmunda/web start
    envVars:
      - { key: NODE_VERSION, value: "22" }
      - { key: NEXT_PUBLIC_API_URL, value: "https://techmunda-api.onrender.com/api/v1" }
